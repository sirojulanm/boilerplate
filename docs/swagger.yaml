basePath: /api/v1
definitions:
  domain.Check:
    properties:
      detail:
        example: uptime=1h2m3s
        type: string
      name:
        example: runtime
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.CheckStatus'
        example: up
    type: object
  domain.CheckStatus:
    enum:
    - up
    - down
    type: string
    x-enum-varnames:
    - CheckUp
    - CheckDown
  domain.Health:
    properties:
      checks:
        items:
          $ref: '#/definitions/domain.Check'
        type: array
      service:
        example: boilerplate
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.Status'
        example: ok
      timestamp:
        example: "2026-10-27T22:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  domain.Status:
    enum:
    - ok
    - degraded
    type: string
    x-enum-varnames:
    - StatusOK
    - StatusDegraded
host: localhost:1111
info:
  contact: {}
  description: Generic health-check API template built with a clean, interface-driven
    architecture.
  title: Boilerplate API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns the current health of the service and its dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Health'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/domain.Health'
      summary: Health check
      tags:
      - health
schemes:
- http
swagger: "2.0"
